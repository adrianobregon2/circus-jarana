<!DOCTYPE html>
<!--
 CIRCUS 3.0 - version online con ranking (Firebase Firestore, gratis)
 PASOS:
 1) console.firebase.google.com > Crear proyecto.
 2) Compilacion > Firestore Database > Crear base de datos (modo produccion).
 3) Pestana "Reglas": pegar lo de abajo y Publicar.
 4) Configuracion del proyecto > Tus apps > Web (</>) > copiar firebaseConfig y pegarlo en FB (mas abajo, en el script).
 5) Subir este archivo (renombrado index.html) a Netlify Drop, Cloudflare Pages o GitHub Pages. Generar un QR con el link.
 REGLAS:
 rules_version = '2';
 service cloud.firestore { match /databases/{d}/documents { match /scores/{id} {
   allow read: if true;
   allow create: if request.resource.data.name is string && request.resource.data.name.size() <= 12
     && request.resource.data.score is int && request.resource.data.score >= 0 && request.resource.data.score <= 2000;
   allow update, delete: if false; } } }
 Sin configurar FB, funciona en "MODO LOCAL" (ranking solo en ese celu).
-->
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CIRCUS 3.0 – Jarana Pub</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{overscroll-behavior:none;height:100%;margin:0;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center}
canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;touch-action:manipulation;cursor:pointer}
#nm{position:fixed;left:50%;top:50%;transform:translateX(-50%);width:min(76vw,300px);display:none;text-align:center;font-family:'Press Start 2P',monospace}
#nm input{width:100%;box-sizing:border-box;padding:12px 8px;font:inherit;font-size:16px;text-align:center;text-transform:uppercase;background:#000;color:#fff;border:2px solid #27d6f0;outline:none;border-radius:0}
#nm button{font:inherit;font-size:12px;margin-top:10px;padding:12px;width:100%;background:#e8281e;color:#fff;border:0;cursor:pointer}
#nm button.s{background:none;color:#888;font-size:8px;margin-top:4px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script></head><body>
<canvas id="c" width="270" height="480"></canvas>
<div id="nm"><input id="inp" maxlength="12" placeholder="NOMBRE" autocomplete="off"><button id="ok">ENVIAR</button><button class="s" id="sk">SIN GUARDAR</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=270,H=480,G=372;
// ===== DIFICULTAD (tocá solo estos numeros) =====
// goal: metros hasta la meta | v0: velocidad inicial | vmax: velocidad maxima
// ramp: cuanto mas chico, mas rapido acelera | gapMin/gapMax: separacion entre obstaculos (1.0 = casi imposible, 2.5 = facil)
const DIF={goal:900,v0:2.8,vmax:5.8,ramp:700,gapMin:0.9,gapMax:2.2};
const TOUCH=matchMedia('(pointer:coarse)').matches,PRE=TOUCH?'TOCA PARA ':PRE;
const RED='#e8281e',CY='#27d6f0',WH='#fff',GOLD='#c9a227',FONT='"Press Start 2P",monospace';
let step=0,mode='flyer',T=[0],now=0,last=0,blink=0;
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0)};
const tw=(s,sz)=>{ctx.font=sz+'px '+FONT;return ctx.measureText(s).width};
function txt(s,x,y,sz,c,al='center'){if(al=='center'){while(sz>5&&tw(s,sz)>W-56)sz--}ctx.font=sz+'px '+FONT;ctx.textAlign=al;ctx.textBaseline='top';ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);ctx.fillStyle=c;ctx.fillText(s,x,y)}
function multi(parts,y,sz){while(sz>5&&tw(parts.map(p=>p[0]).join(''),sz)>W-56)sz--;let x=(W-tw(parts.map(p=>p[0]).join(''),sz))/2;for(const[p,c]of parts){txt(p,x,y,sz,c,'left');x+=tw(p,sz)}}
function letters(s,y,sz,fn){let x=(W-tw(s,sz))/2;for(let i=0;i<s.length;i++){txt(s[i],x,y,sz,fn(i,s[i]),'left');x+=tw(s[i],sz)}}
function dots(y){for(let x=14;x<W-14;x+=6)R(x,y,4,1,'#777')}
function curtains(){
 for(let s=0;s<2;s++)for(let y=0;y<H;y+=2){const w=22+Math.sin(y/9)*3;const x=s?W-w:0;R(x,y,w,2,y%8<4?'#8f1010':'#b81818');R(s?x:w-2,y,2,2,GOLD)}
 for(let x=0;x<W;x+=2){const h=26+Math.abs(Math.sin(x/20))*14;R(x,0,2,h,x%8<4?'#8f1010':'#c01c1c');R(x,h,2,2,GOLD)}
 for(let s=0;s<2;s++)for(let y=H-60;y<H;y+=2){const w=(y-(H-60))*.8;R(s?W-w:0,y,w,2,'#a01515')}
}
function tent(cx,y){R(cx-1,y-12,2,12,'#ff4fa0');R(cx+1,y-12,8,4,'#ffb000');
 for(let r=0;r<16;r++){const hw=r*2.4+2;for(let c=-hw;c<hw;c+=4)R(cx+c,y+r*2,4,2,Math.floor((c+hw)/4)%2?CY:RED)}
 for(let i=-30;i<=30;i+=10)R(cx+i-2,y+32,8,4,i%20?RED:CY)}
function clown(x,y){R(x,y,22,30,WH);R(x+3,y+6,4,8,'#27a0f0');R(x+15,y+6,4,8,'#27a0f0');R(x+8,y+14,6,5,'#ff4f7a');R(x+4,y+22,14,3,RED)}
function jester(x,y){R(x,y+4,18,12,'#3a8a78');R(x+10,y,8,6,'#e05030');R(x+4,y+16,14,12,'#f0d8c0');R(x+6,y+21,3,2,'#555')}
function carousel(cx,y){for(let r=0;r<10;r++)R(cx-r*2-4,y+r,r*4+8,1,r%2?'#ff4f4f':'#e82020');R(cx-1,y-5,2,5,GOLD);
 R(cx-18,y+12,2,16,GOLD);R(cx+16,y+12,2,16,GOLD);R(cx-1,y+12,2,16,GOLD);R(cx-14,y+20,8,6,RED);R(cx+6,y+20,8,6,RED);R(cx-5,y+22,10,5,'#ffb000')}
function el(i,fn){if(step<i)return;const a=Math.min(1,(now-T[i])/250);ctx.save();ctx.globalAlpha=a;ctx.translate(0,(1-a)*-10);fn();ctx.restore()}
function flyer(){
 R(0,0,W,H,'#0b0508');
 for(let i=0;i<8;i++)R(60+i*20,150,10,330,'#150a0e');
 curtains();
 el(1,()=>{ctx.strokeStyle=WH;ctx.lineWidth=1;for(let i=0;i<8;i++)R(135-1+Math.cos(i*.785)*14,65+Math.sin(i*.785)*14,3,3,WH);R(133,63,4,4,WH);txt('JARANA PUB',W/2,92,16,WH)});
 el(2,()=>{tent(W/2,118);clown(204,130);jester(42,132);txt('WELCOME',W/2,172,18,WH)});
 el(3,()=>{const cs=[RED,WH,RED,WH,RED,WH,WH,RED,WH];letters('CIRCUS 3.0',200,20,(i,ch)=>ch=='.'?RED:cs[i%9]);
  for(let i=0;i<9;i++){R(46+i*20,230,16,6,i%2?RED:CY)}});
 el(4,()=>{dots(250);letters('SAB.10.OCT',262,18,i=>i==1||i==2||i==8||i==9?CY:WH);dots(290)});
 el(5,()=>{multi([['L',WH],['I',RED],['NE UP',WH]],308,16);txt('LUCAS',78,332,10,'#ff4fa0');txt('RIVERO',78,348,10,WH);txt('OSIRIS',188,332,9,WH);txt('FACUNDO',188,347,9,WH);txt('DJ',226,360,6,WH)});
 el(6,()=>{dots(386);txt('JUAN ROMERO ESQ SAN MARTIN',W/2,396,8,WH);dots(414)});
 if(Math.floor(blink/30)%2==0||step>=6)multi(step<6?[[PRE,WH],['CONTINUAR',RED]]:[[PRE,WH],['JUGAR',CY]],430,8);
 carousel(W/2,444);
 if(mode=='over'||mode=='win'){}
}
// ---- juego ----
let g,res=null,board=null;
const FB={apiKey:"AIzaSyC1tuyt_iPIYGISOjdnvcPfkXtZFVuE_Ew",authDomain:"jarana-circus.firebaseapp.com",projectId:"jarana-circus",appId:"1:821190166687:web:d455d1d364d9d7389a7aaa"};
let db=null,offline=false;
try{if(!FB.projectId.startsWith('TU_')){firebase.initializeApp(FB);db=firebase.firestore()}}catch(e){}
const nm=document.getElementById('nm'),inp=document.getElementById('inp'),ok=document.getElementById('ok'),sk=document.getElementById('sk');
const mkcode=()=>Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join('');
const locGet=()=>{try{return JSON.parse(localStorage.getItem('c3scores')||'[]')}catch(e){return[]}};
const locSave=r=>{try{localStorage.setItem('c3scores',JSON.stringify(locGet().concat(r).slice(-200)))}catch(e){}};
const sortB=a=>a.sort((x,y)=>y.score-x.score||x.ts-y.ts).slice(0,10);
async function getTop(){if(db){try{const q=await db.collection('scores').orderBy('score','desc').limit(10).get();return sortB(q.docs.map(d=>d.data()))}catch(e){offline=true}}return sortB(locGet())}
function placeNm(){const r=cv.getBoundingClientRect(),sc=Math.min(r.width/W,r.height/H);nm.style.top=(r.top+(r.height-H*sc)/2+146*sc)+'px';nm.style.width=Math.min(W*sc*.72,300)+'px'}
addEventListener('resize',placeNm);
function endGame(m){if(mode!='play')return;mode=m;T[7]=now;const secs=g.t/60;
 res={win:m=='win',score:m=='win'?1000+Math.max(0,1000-Math.floor(secs*10)):Math.floor(g.d/10),code:mkcode()};
 try{inp.value=localStorage.getItem('c3name')||''}catch(e){}placeNm();nm.style.display='block'}
async function submit(){const n=inp.value.trim().toUpperCase().replace(/[^A-Z0-9 ._-]/g,'').slice(0,12);if(!n){inp.focus();return}
 ok.disabled=true;try{localStorage.setItem('c3name',n)}catch(e){}
 res.name=n;res.when=new Date().toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
 const rec={name:n,score:res.score,win:res.win,ts:Date.now(),code:res.code};
 nm.style.display='none';mode='rank';T[7]=now;board=null;
 try{if(db)await db.collection('scores').add(rec);else locSave(rec)}catch(e){locSave(rec);offline=true}
 ok.disabled=false;board=await getTop()}
ok.onclick=submit;inp.addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='Enter')submit()});
sk.onclick=()=>{nm.style.display='none';mode='flyer'};
function rankScreen(){R(0,0,W,H,'#0b0508');for(let i=0;i<8;i++)R(30+i*30,60,14,G-60,'#150a0e');curtains();
 txt('RANKING',W/2,52,14,CY);
 if(!board)txt('CARGANDO...',W/2,200,8,WH);else board.forEach((r,i)=>{const y=80+i*24,c=res&&r.code==res.code?CY:WH;txt(''+(i+1),34,y,8,c,'left');txt(r.name,56,y,8,c,'left');txt(''+r.score,W-34,y,8,c,'right')});
 if(res&&res.name){txt('TU CODIGO '+res.code,W/2,336,8,CY);txt(res.name+' - '+res.score+' - '+res.when,W/2,352,6,WH);txt('MOSTRA ESTA PANTALLA EN LA BARRA',W/2,370,6,WH)}
 if(!db||offline)txt('MODO LOCAL',W/2,392,6,RED);
 multi([[PRE,WH],['JUGAR',CY]],420,8)}
function start(){g={y:0,vy:0,d:0,sp:DIF.v0,obs:[],next:250,t:0};mode='play'}
function jump(){if(g.y==0)g.vy=9}
function game(dt){
 R(0,0,W,H,'#0b0508');
 for(let i=0;i<8;i++)R(30+i*30,60,14,G-60,'#1a0c10');
 for(let i=0;i<9;i++)R(i*30,80+(i%2)*4,30,4,i%2?'#3a1010':'#102a35');
 g.t+=dt;g.d+=g.sp*dt;g.sp=Math.min(DIF.vmax,DIF.v0+g.d/DIF.ramp);
 g.vy-=.5*dt;g.y=Math.max(0,g.y+g.vy*dt);if(g.y==0)g.vy=0;
 g.next-=g.sp*dt;if(g.next<=0){const hoop=Math.random()<.4;g.obs.push({x:W+20,w:hoop?14:16,h:hoop?14:22,hoop});g.next=36*g.sp*(DIF.gapMin+Math.random()*(DIF.gapMax-DIF.gapMin))}
 const goal=Math.max(0,DIF.goal-Math.floor(g.d/10));
 for(const o of g.obs){o.x-=g.sp*dt}
 g.obs=g.obs.filter(o=>o.x>-30);
 R(0,G,W,H-G,'#7a1a12');for(let x=-(g.d%24);x<W;x+=24)R(x,G,12,6,'#c0392b');
 for(const o of g.obs){const f=Math.floor(g.t/4)%2;
  if(o.hoop){for(let a=0;a<12;a++){const an=a/12*6.28;R(o.x+7+Math.cos(an)*13-2,G-62+Math.sin(an)*20,5,5,(a+f)%2?'#ffb000':RED)}}
  R(o.x,G-o.h,o.w,o.h,'#9a9aa8');R(o.x+2,G-o.h-6-f*2,o.w-4,6,'#ffb000');R(o.x+4,G-o.h-10-f*3,o.w-8,5,RED)}
 // jugador: leon + payaso
 const px=50,py=G-g.y,f=Math.floor(g.t/6)%2;
 R(px,py-16,34,12,'#e8a020');R(px+30,py-24,12,14,'#c07010');R(px+36,py-20,8,5,'#ffd070');R(px-6,py-14,8,3,'#e8a020');
 R(px+2,py-5,4,5+(g.y?0:f?0:-2),'#e8a020');R(px+26,py-5,4,5+(g.y?0:f?-2:0),'#e8a020');
 R(px+10,py-34,10,18,'#2b5cff');R(px+10,py-42,10,8,'#f0d8c0');R(px+9,py-47,12,5,RED);
 // hud
 txt('META '+goal+'M',W/2,52,8,WH);if(g.t<200)txt(TOUCH?'TOCA PARA SALTAR':'X PARA SALTAR',W/2,68,8,CY);
 curtains();
 for(const o of g.obs){if(px+26>o.x&&px+2<o.x+o.w&&py>G-o.h-4){endGame('over')}}
 if(goal==0){endGame('win')}
}
function endScreen(win){
 ctx.save();ctx.globalAlpha=.88;R(24,60,W-48,192,'#000');ctx.restore();R(24,60,W-48,2,CY);R(24,250,W-48,2,CY);
 txt(win?'GANASTE!':'GAME OVER',W/2,72,16,win?CY:RED);txt('PUNTAJE '+res.score,W/2,102,10,WH);txt('TU NOMBRE:',W/2,128,8,WH)
}
function loop(t){const dt=Math.min(2,(t-(last||t))/16.67);last=t;now=t;blink++;
 if(mode=='flyer')flyer();else if(mode=='play')game(dt);else if(mode=='rank')rankScreen();else{game(0);endScreen(mode=='win')}
 requestAnimationFrame(loop)}
function press(){
 if(mode=='flyer'){if(step<6){step++;T[step]=now}else start()}
 else if(mode=='play')jump();
 else if(mode=='rank'&&now-T[7]>400)mode='flyer';
}
addEventListener('keydown',e=>{if(['x','X',' ','ArrowUp','Enter'].includes(e.key)){e.preventDefault();if(!e.repeat)press()}});
cv.addEventListener('pointerdown',e=>{e.preventDefault();press()});
(document.fonts?document.fonts.load('16px "Press Start 2P"').catch(()=>{}):Promise.resolve()).then(()=>requestAnimationFrame(loop));
</script></body></html>
